[project]
name = "alim-context-backend"
version = "0.1.0"
description = "Local-first context compiler for the Alim tutoring application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
