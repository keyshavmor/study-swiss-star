[project]
name = "alim-context-backend"
version = "0.2.0"
description = "Local-first context compiler for the Alim tutoring application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
model-download = ["huggingface-hub>=0.35,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = ["..", "."]
cache_dir = "../tests/results/.pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "../tests/results/.ruff_cache"
